 return `<div class="gantt-row feature"><div class="meta"><button class="chevron" data-action="collapse" data-id="${f.id}" title="Collapse / expand">${icon(f.collapsed?'chevron':'chevrondown',14)}</button><span class="feature-icon" style="background:${f.color}1d;color:${f.color}">${icon('grid',15)}</span><div class="work-name" data-action="drawer-feature" data-id="${f.id}"><strong>${esc(f.title)}</strong><small>${visibleCount!==null?`${visibleCount} of ${count} tasks`:`${count} tasks`} · Baseline ${dmy(f.baseline)}</small></div>${pills}<span class="meta-mini">${text}</span><button class="more-button" data-action="open-task" data-id="${f.id}" title="Add child task">${icon('plus',14)}</button></div><div class="track">${shades(null)}${bar}</div></div>`}
function taskRow(t){let info=computed.schedule[t.id],conf=computed.conflicts[t.id]||[],none=!t.assignee;
 let status=t.status==='hold'?'hold':info.blocked?'blocked':t.status==='done'?'done':'';
 let l=leftPct(info.start??asDay(t.start)),width=info.end!==null?widthSpan(info.start,info.end):Math.max(2*view.zoom,74);
 let bar=info.end!==null?`<div class="task-bar ${String(t.platform).toLowerCase()} ${status}" style="left:${l}px;width:${width}px" draggable="false" data-task="${t.id}" data-action="drawer-task" data-id="${t.id}" title="${esc(t.title)} · ${num(t.effort,1)}d effort · ${info.start!==null?dmy(fromDay(info.start)):'—'}–${dmy(fromDay(info.end))}"><span class="bar-txt">${esc(t.title)}</span>${conf.length?`${icon('warning',11)}`:''}<span class="bar-tail">${num(t.effort,1)}d</span></div>`:`<div class="task-bar ${status}" style="left:${l}px;width:${width}px" data-action="drawer-task" data-id="${t.id}" title="${esc(t.title)}"><span>${status==='hold'?'⏸ Paused':'⌛ Blocked'}</span></div>`;
 let helper=t.status==='hold'?'Paused':info.blocked?'Blocked':info.end!==null?dmy(fromDay(info.end)):'—';
 let circle=t.status==='done'?`<span class="status-circle done">${icon('check',10)}</span>`:t.status==='hold'?`<span class="status-circle hold">${icon('pause',10)}</span>`:`<span class="status-circle ${t.status==='progress'?'progress':''}"></span>`;
 let bad=conf.length?`<span title="Conflicting capacity on ${conf.length} day(s)" style="color:#e27f8e">${icon('warning',13)}</span>`:'';
 return `<div class="gantt-row"><div class="meta"><span class="task-indent"></span>${circle}<div class="work-name" data-action="drawer-task" data-id="${t.id}"><strong>${esc(t.title)}</strong><small>${esc(t.platform)} · ${num(t.effort,1)}d effort ${t.dependsOn?.length?' · '+t.dependsOn.length+' dep.':''}</small></div>${bad}${personAvatar(t.assignee)}<span class="meta-mini">${helper}</span><button class="more-button" data-action="drawer-task" data-id="${t.id}" title="Edit task">${icon('more',15)}</button></div><div class="track">${shades(t.assignee)}${view.scale==='day'||view.scale==='week'?conf.map(s=>`<div class="shade overload" style="left:${leftPct(asDay(s))}px;width:${view.zoom}px" title="Overbooked: ${s}"></div>`).join(''):''}${bar}</div></div>`}
function ganttOverlay(){let arr=[],range=asDay(view.rangeStart),max=range+view.days,cell=view.zoom,meta=350; // CSS --meta-w handles responsive
 if(asDay(today())>=range&&asDay(today())<max){let left=`calc(var(--meta-w) + ${leftPct(asDay(today()))+cell/2}px)`;arr.push(`<div class="today-line" style="left:${left}"></div><div class="today-tag" style="left:${left}">Today</div>`)}
 for(let m of data.milestones){let day=asDay(m.date);if(day<range||day>=max)continue;let missed=m.featureIds?.some(id=>{let f=computed.featureInfo[id];return f&&f.end!==null&&f.end>day})||false;let x=`calc(var(--meta-w) + ${leftPct(day)+cell/2}px)`;
 arr.push(`<div class="milestone-line ${missed?'risk':''}" style="left:${x};border-color:${missed?'#ed7d89':m.color}"></div><button class="milestone-pin ${missed?'risk':''}" style="left:${x}" data-action="drawer-milestone" data-id="${m.id}" title="${esc(m.title)} · ${fullD(m.date)} · Drag to move">${icon('flag',11)} <span>${esc(m.title)}</span></button>`)}
 return arr.join('')}
function renderGantt(){

 let rows=list.flatMap(f=>{let tasks=matchingTasks(f.id);return [featureRow(f,isFiltered()?tasks.length:null),...(f.collapsed?[]:tasks.map(taskRow))]});

 let empty=`<div class="empty-message"><h3>${filtered?'No matching work items':'Your roadmap is ready'}</h3><p>${filtered?'Try clearing the filters or choosing another team member.':'Create your first feature to begin planning.'}</p>${isFiltered()?'<button class="btn sm" data-action="clear-filters">Clear filters</button>':''}</div>`;
 return `<div class="gantt-scroller" id="ganttScroller"><div class="gantt-canvas scale-${view.scale}" style="--total-days:${view.days};--cell:${view.zoom}px;min-width:calc(var(--meta-w) + ${view.days*view.zoom}px)">${headings()}${rows.join('')||empty}${ganttOverlay()}</div></div>`;

function capacityView(){const i=iter();return `<section class="card"><div class="board-toolbar"><div class="toolbar-left"><span class="section-label">Allocation by team member</span>${selectionBar()}</div><div class="toolbar-right"><button class="btn sm" data-action="open-iteration">${icon('edit')} Iteration settings</button></div></div><div class="panel-body"><div class="notice" style="margin-bottom:16px">${icon('info',15)} <strong>Pure effort ≠ elapsed time.</strong> A 3-day estimate includes development, unit tests & review. Meetings, bugs and ongoing work are deducted from availability automatically.</div><div class="capacity-layout"><div><table class="table"><thead><tr><th>TEAM MEMBER</th><th>ALLOCATION</th><th>FEATURE CAPACITY</th><th>LOAD</th><th></th></tr></thead><tbody>${data.people.map(p=>{let r=resourceStats(p.id,i),a=p.capacity,ratio=capacityParts(p.id,i.start).feature;return `<tr><td><div class="person-cell">${personAvatar(p.id,'avatar')}<div><strong>${esc(p.name)}</strong><small>${esc(p.role)}</small></div></div></td><td><div class="capacity-track"><i class="dev" style="width:${a.feature}%"></i><i class="bugs" style="width:${a.bugs}%"></i><i class="ongoing" style="width:${a.ongoing}%"></i><i class="ops" style="width:${a.ops}%"></i></div><small style="color:#9ca6b8">${ratio}% features</small></td><td>${num(r.capacity,1)}d / ${r.days} work days<small style="display:block;color:#929db0;margin-top:4px">${num(meetingHoursInIteration(p.id,i),1)}h in meetings</small></td><td><span class="status-badge ${r.pct>100?'risk':'muted'}">${r.pct}%</span></td><td><button class="mini-btn" data-action="open-person" data-id="${p.id}">Configure</button></td></tr>`}).join('')}</tbody></table><div class="grouped-note"><strong>What goes into an estimate?</strong><p>Engineering effort = coding + unit tests + code review. Recurring meetings first reduce each person’s working hours; feature allocation is then applied to the remaining time. Ops % should cover other overhead, not these meetings. Leaves, weekends and dependencies are also applied.</p></div></div><div class="card" style="padding:18px;box-shadow:none"><h3 class="panel-title">Capacity vs scheduled</h3><p class="panel-sub">${esc(i.name)} · ${dmy(i.start)} – ${dmy(i.end)}</p>${data.people.map(p=>{let r=resourceStats(p.id,i);return `<div class="resource-row"><div class="resource-title"><span>${esc(p.name)}</span><small>${num(r.load,1)} / ${num(r.capacity,1)}d</small></div><div class="load-track"><div class="load-fill ${r.pct>100?'over':''}" style="width:${Math.min(r.pct,100)}%"></div><div class="load-over"></div></div></div>`}).join('')}<div class="split-head" style="margin-top:20px;margin-bottom:5px"><strong style="font-size:11px">Daily load heatmap</strong><small style="color:#99a2b1">each cell = 1 day</small></div>${data.people.map(p=>{let html=[];for(let d=asDay(i.start);d<=asDay(i.end);d++){let date=fromDay(d),load=computed.working.get(`${p.id}:${date}`)||0,cap=featureCapacity(p.id,date);let cls=nonwork(d,p.id)?'off':load>cap+.001?'over':load>cap*.88?'high':load>0?'low':'free';html.push(`<i class="${cls}" title="${p.name} · ${date}: ${num(load,2)} / ${num(nonwork(d,p.id)?0:cap,2)}d feature capacity"></i>`)}return `<div style="margin:9px 0 14px"><div class="resource-title" style="font-size:10px"><span>${esc(p.name)}</span><small>${resourceStats(p.id,i).pct}%</small></div><div class="grid-mini" style="grid-template-columns:repeat(${html.length},minmax(12px,1fr))">${html.join('')}</div></div>`}).join('')}<div class="tag-row"><span class="tag">Free</span><span class="tag" style="background:#e7e2fc">Booked</span><span class="tag" style="background:#efa1ae;color:#85404a">Conflict</span><span class="tag">Off</span></div></div></div></div></section>`}

p(h=>`<div class="metric-row"><span>${dmy(h.date)} · ${esc(h.name)}</span><button class="icon-action" data-action="delete-holiday" data-id="${h.date}" title="Delete">${icon('trash',14)}</button></div>`).join('')}<button class="btn sm" data-action="open-holiday">${icon('plus')} Add holiday</button></section><section class="card panel-body"><h3 class="panel-title">Planning rules</h3><div class="metric-row"><span>Default working days</span><strong>Mon–Fri</strong></div><div class="metric-row"><span>Personal leave</span><strong>Always excluded</strong></div><div class="metric-row"><span>Dependent tasks</span><strong>Shift automatically</strong></div><div class="metric-row"><span>Conflicting parallel tasks</span><strong>Flag, don't reorder</strong></div></section></div></div>`}

pen-leave" data-id="${p.id}">${icon('calendar')} Add time off</button></div>`}
function milestoneInspector(m){let risk=(m.featureIds||[]).map(id=>({f:getFeature(id),s:computed.featureInfo[id]})).filter(x=>x.f&&x.s&&x.s.end!==null&&x.s.end>asDay(m.date));return `<div class="drawer-section"><div class="field"><label>Milestone name</label><input data-update-milestone="title" value="${esc(m.title)}"></div>${dateField('Date','milestoneDate',m.date)}<div class="field"><label>Marker color</label><input type="color" id="milestoneColor" value="${esc(m.color)}" style="height:43px;padding:5px"></div><div class="section-head">Linked features</div>${data.features.map(f=>`<label class="checkline"><input type="checkbox" data-milestone-feature="${f.id}" ${m.featureIds?.includes(f.id)?'checked':''}>${esc(f.title)}</label>`).join('')}<div style="margin-top:14px;display:flex;gap:9px"><button class="btn primary" data-action="save-milestone" data-id="${m.id}">${icon('save')} Save milestone</button><button class="btn danger" data-action="delete-milestone" data-id="${m.id}">${icon('trash')}</button></div></div><div class="drawer-section"><div class="section-head">Milestone health</div>${risk.length?`<div class="notice warn">${risk.length} linked feature(s) forecast beyond this marker: ${risk.map(x=>x.f.title).join(', ')}</div>`:'<div class="notice good">No linked feature currently misses this milestone.</div>'}</div>`}
function modalMarkup(){if(!view.modal)return '';let m=view.modal,content='',title='',subtitle='',footer='',wide=false;

 content=`<form id="modalForm" data-form="new-project">${textField('Project name','projectName','','required autofocus maxlength="100" placeholder="e.g. Mobile app 2027"')}

  <div id="newProjectCopyOptions" class="copy-settings-choices" hidden><label class="checkline"><input type="checkbox" name="copyTeam" checked> ${icon('users',14)} Copy team, roles and capacity</label><label class="checkline"><input type="checkbox" name="copyMeetings" checked> ${icon('clock',14)} Copy all recurring meetings</label><small>Only setup is copied — not tasks, time off, milestones or existing features. You can review everything in the next two steps.</small></div></div>
  <div class="grouped-note"><strong>Next: quick setup</strong><p>Step 1: team and roles · Step 2: recurring meetings. Both steps are optional. Your existing projects stay intact.</p></div><div class="dialog-foot">${submit('Create & set up')}</div></form>`;
 }else if(m.type==='projects'){
 title='Your projects';subtitle='Switch between independent roadmaps, or start a new one.';
 content=`${workspace.projects.map(p=>`<div class="project-pick-row ${p.id===workspace.activeId?'is-current':''}"><span class="team-role-icon">${icon('grid',17)}</span><div class="project-pick-name"><strong>${esc(p.name)}</strong><small>${p.data.features.length} features · ${p.data.people.length} team members</small></div>${p.id===workspace.activeId?'<span class="soft-tag">Current</span>':`<button class="btn sm" data-action="switch-project" data-id="${p.id}">Open project ${icon('chevron',12)}</button>`}</div>`).join('')}<div class="dialog-foot"><button class="btn" data-action="close-modal">Close</button><button class="btn primary" data-action="new-project">${icon('plus',14)} New project</button></div>`;
 }else if(m.type==='feature'){

 content=`<form id="modalForm" data-form="feature"><div class="field-grid">${textField('Feature name','name','', 'required placeholder="e.g. New onboarding"')}${dateField('Earliest start','start',addDays(monday(today()),7))}</div>${textField('Description','description','','placeholder="What are we delivering?"')}${dateField('Baseline target date','baseline',addDays(monday(today()),28))}<div class="hr"></div><div class="section-head">Generate sub-tasks <span class="soft-tag">Optional quick setup</span></div><p class="panel-sub">Choose roles/workstreams to generate. Chain dependencies in the order shown, and edit anytime.</p><div class="phase-grid">${phases.map(([p,person,days],i)=>`<div class="phase-tile"><input type="checkbox" name="phase_${i}" ${['Backend','Frontend','QA'].includes(p)?'checked':''} aria-label="Include ${p}"><div style="min-width:0;flex:1"><strong>${p}</strong><small>Pure engineering effort</small><div style="display:flex;gap:5px;margin-top:7px"><input aria-label="${p} estimated days" type="number" name="phase_days_${i}" min=".5" step=".5" value="${days}" style="width:65px;border:1px solid #e1e5ef;border-radius:6px;padding:5px;font-size:10px"><select aria-label="${p} owner" name="phase_owner_${i}" style="width:105px;min-width:0;border:1px solid #e1e5ef;border-radius:6px;padding:5px;font-size:10px">${personOptions(person,true,p)}</select></div></div></div>`).join('')}</div><label class="checkline"><input type="checkbox" name="sequential" checked> Chain selected phases as dependencies</label><div class="dialog-foot">${submit('Create feature')}</div></form>`;
 }else if(m.type==='task'){

 }else if(m.type==='member'){

 title=p?'Edit team member':'Add team member';subtitle='Select a role. Platform and matching work item assignments update automatically.';
 content=`<form id="modalForm" data-form="member"><div class="field-grid">${textField('First name','firstName',parts.first,'required placeholder="e.g. Oleksandr"')}${textField('Last name','lastName',parts.last,`${p?'':'required '}placeholder="e.g. Shevchenko"`)}</div><div class="field"><label>Role</label><select name="roleId" required>${!data.roles.length?'<option value="">Create a role first</option>':roleOptions(p?.roleId||data.roles[0].id)}</select></div><div class="grouped-note"><strong>Capacity settings stay separate</strong><p>New members inherit the workspace default capacity. You can customize their allocation later on the Team capacity page.</p></div><div class="dialog-foot"><button type="button" class="btn" data-action="go-team">Cancel</button><button type="submit" class="btn primary" ${!data.roles.length?'disabled':''}>${icon('check')} ${p?'Save changes':'Add member'}</button></div></form>`;

 }else if(m.type==='leave'){

 content=`<form id="modalForm" data-form="leave"><div class="field"><label>Team member</label><select name="person">${personOptions(x?.person||m.person||data.people[0]?.id)}</select></div>${selectField('Type','type',[['vacation','Vacation'],['sick','Sick leave'],['dayoff','Day off']],x?.type||'vacation')}<div class="field-grid">${dateField('From','from',x?.from||start)}${dateField('To (inclusive)','to',x?.to||addDays(start,4))}</div>${textField('Note','note',x?.note||'','placeholder="Optional"')}<div class="dialog-foot">${submit(x?'Save time off':'Add time off')}</div></form>`;
 }else if(m.type==='milestone'){

 }else if(m.type==='settings'){
 title='Workspace settings';subtitle='Small defaults that make scheduling feel effortless.';
 content=`<form id="modalForm" data-form="settings"><div class="field-grid">${numberField('Working hours / day','workHours',data.settings.workHours,1,24,1)}<div class="field"><label>Working week</label><input value="Monday – Friday" disabled></div></div><div class="switch-row"><div><strong>Account for Ukrainian public holidays</strong><small>During martial law, your actual company policy may differ.</small></div><input style="width:20px;height:20px;accent-color:#7669e6" type="checkbox" name="holidays" ${data.settings.observeHolidays?'checked':''}></div><div class="meeting-settings-entry"><div><strong>${icon('users',17)} Team & roles</strong><small>${data.people.length} members · ${data.roles.length} roles · dynamically generated work item platforms</small></div><button type="button" class="btn sm" data-action="go-team">${icon('edit')} Manage team</button></div><div class="meeting-settings-entry"><div><strong>${icon('clock',17)} Recurring meetings</strong><small>${(data.meetings||[]).filter(m=>m.enabled).length} active recurring events · deducted from the appropriate people’s capacity</small></div><button class="btn sm" type="button" data-action="manage-meetings">${icon('edit')} Manage meetings</button></div><div class="grouped-note"><strong>Roadmap data</strong><p>Local browser storage · Export or import JSON to back up this project.</p><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px"><button type="button" class="btn sm" data-action="export">${icon('download')} Export JSON</button><button type="button" class="btn sm" data-action="import">${icon('upload')} Import JSON</button><input id="jsonImport" type="file" accept=".json,application/json" hidden><button type="button" class="btn sm danger" data-action="reset">Reset project</button></div></div><div class="grouped-note"><strong>Scheduling behavior</strong><p>We never auto-prioritize your tasks or change status. Task estimates reflect pure engineering work. Dependents reflow on calendar changes; overload is displayed without silently altering your priorities.</p></div><div class="dialog-foot">${submit('Save settings')}</div></form>`;
 }else if(m.type==='meetings'){
 title='Recurring meetings';subtitle='Reserve team time once. Every future iteration and dependent roadmap date adjusts automatically.';wide=true;
 content=`<div class="notice" style="margin-bottom:14px">${icon('info',15)} <div><strong>How meetings affect estimates</strong><div style="margin-top:4px">Daily feature capacity = (working hours − scheduled meeting hours) × feature allocation %. Meeting overlaps count only once. The operations buffer should exclude these recurring events.</div></div></div><div class="meeting-list">${(data.meetings||[]).map(mt=>`<div class="meeting-item ${mt.enabled?'':'muted-item'}"><div class="meeting-symbol">${icon('clock',18)}</div><div class="meeting-main"><strong>${esc(mt.title)}</strong><small>${esc(meetingRecurrenceLabel(mt))} · ${esc(mt.startTime)} · ${esc(mt.duration)} min</small><small>${esc(meetingPeopleLabel(mt))}${mt.requiresAttendeeReview?' · Needs attendee review':''}</small></div><div class="meeting-controls"><button class="mini-btn" data-action="toggle-meeting" data-id="${mt.id}" title="${mt.enabled?'Disable':'Enable'}">${mt.enabled?'Enabled':'Paused'}</button><button class="mini-btn" data-action="edit-meeting" data-id="${mt.id}">Edit</button><button class="icon-action" data-action="delete-meeting" data-id="${mt.id}" title="Delete meeting">${icon('trash',15)}</button></div></div>`).join('')||'<div class="grouped-note">No meetings yet. Add a regular event to reserve time automatically.</div>'}</div><div class="dialog-foot"><button class="btn" data-action="close-modal">Close</button><button class="btn primary" data-action="new-meeting">${icon('plus')} Add meeting</button></div>`;
 }else if(m.type==='meeting'){

rson-role">${esc(p.platform)}</span></label>`).join('')}</div></div><div class="grouped-note" style="margin-top:4px"><strong>Example</strong><p>A 30-minute meeting on an 8-hour workday leaves 7.5 hours. At 60% feature allocation, that day offers 4.5 hours of engineering effort.</p></div><div class="dialog-foot"><button type="button" class="btn" data-action="${view.setupStep===2?'setup-close-meeting':'manage-meetings'}">${view.setupStep===2?'Back to setup':'Back to meetings'}</button><button type="submit" class="btn primary">${icon('check')} ${edit?'Save changes':'Create meeting'}</button></div></form>`;
 }else if(m.type==='iteration'){

 content=`<form id="modalForm" data-form="iteration"><div class="field"><label>Iteration</label><select name="iterationId">${data.iterations.map(it=>`<option value="${it.id}" ${it.id===i.id?'selected':''}>${esc(it.name)}</option>`).join('')}<option value="new">+ New iteration</option></select></div>${textField('Iteration name','name',i.name,'required')}<div class="field-grid">${dateField('Start','start',i.start)}${dateField('End','end',i.end)}</div><div class="dialog-foot">${submit('Save iteration')}</div></form>`;
 }else if(m.type==='help'){

 }else if(m.type==='reset'){

 if(step===1){

  return;
 }
 if(target.name==='platform'&&view.modal?.type==='task'){
  const assignee=$('#modalForm [name="assignee"]');if(assignee)assignee.innerHTML=personOptions('',true,target.value);
  return;
 }
 if(target.dataset.change==='iteration'){view.iteration=target.value;render();return}
 if(target.dataset.change==='scale'){setScale(target.value);return}
 if(target.dataset.change==='filter-person'){view.filterPerson=target.value;render();return}
 if(target.dataset.change==='filter-platform'){view.filterPlatform=target.value;render();return}
 if(target.dataset.updateTask){let t=getTask(view.drawer?.id);if(!t)return;let field=target.dataset.updateTask,val=target.value;
 if(field==='title'){if(!val.trim()){notify('Task title cannot be empty');return}change(()=>t.title=val.trim())}
 else if(field==='assignee'){if(val&&getPerson(val)?.platform!==t.platform){notify('Selected person does not match the workstream');render();return}change(()=>t.assignee=val,'Assignment updated')}
 return;
 }
 if(target.dataset.dependency){let t=getTask(view.drawer?.id);if(!t)return;let dep=target.dataset.dependency;let next=new Set(t.dependsOn||[]);if(target.checked)next.add(dep);else next.delete(dep);if(cycleCheck(t.id,[...next])){target.checked=false;notify('Circular dependencies are not allowed');return}change(()=>t.dependsOn=[...next],'Dependencies updated');return}
 if(target.dataset.updateFeature){let f=getFeature(view.drawer?.id);if(!f)return;let name=target.dataset.updateFeature;if(name==='title'&&!target.value.trim()){notify('Feature needs a name');return}change(()=>f[name]=target.value.trim());return}
 if(target.dataset.updateMilestone){return}
 if(target.dataset.milestoneFeature){return}
 let t=view.drawer?.type==='task'?getTask(view.drawer.id):null;
 if(t&&['taskStatus','taskEffort','taskRemaining','taskPlatform','taskStart','taskCompleted'].includes(target.id)){
  let field=target.id,val=target.value;
  change(()=>{
   if(field==='taskStatus'){t.status=val;if(val==='done')t.completedDate=t.completedDate||today();if(val==='progress'&&t.start<today())t.start=today()}
   if(field==='taskEffort'){t.effort=Math.max(.5,+val||.5);if(t.remaining===undefined)t.remaining=t.effort}
   if(field==='taskRemaining')t.remaining=Math.max(.5,+val||.5);
   if(field==='taskPlatform'){t.platform=val;if(t.assignee&&getPerson(t.assignee)?.platform!==val)t.assignee=''}
   if(field==='taskStart')t.start=val;
   if(field==='taskCompleted')t.completedDate=val;
  },'Forecast recalculated');return;
 }
 let f=view.drawer?.type==='feature'?getFeature(view.drawer.id):null;
 if(f&&['featureStart','featureBaseline'].includes(target.id)){
  let field=target.id,val=target.value;
  if(field==='featureStart'){let delta=asDay(val)-asDay(f.start);change(()=>{data.tasks.filter(t=>t.featureId===f.id).forEach(t=>t.start=addDays(t.start,delta));f.start=val},'Feature plan shifted');}
  else change(()=>{f.baseline=val},'Baseline updated');return;
 }
});
document.addEventListener('submit',e=>{
 if(e.target.id==='authForm'){e.preventDefault();handleAuthForm(e.target);return;}
 if(e.target.id==='modalForm'){e.preventDefault();applyForm(e.target);return}
 if(e.target.id==='onboardingMemberForm'){
  e.preventDefault();const f=new FormData(e.target),first=String(f.get('firstName')||'').trim(),last=String(f.get('lastName')||'').trim(),role=String(f.get('role')||'').trim();
  if(!first||!last||!role){notify('First name, last name and role are required');return}
  if(data.people.some(p=>p.name.toLowerCase()===`${first} ${last}`.toLowerCase())){notify('This team member is already added');return}
  change(()=>{
   let r=data.roles.find(r=>r.name.toLowerCase()===role.toLowerCase());
   if(!r){r={id:uid('r'),name:role,platform:guessPlatform(role)};data.roles.push(r)}
   data.people.push({id:uid('u'),firstName:first,lastName:last,name:`${first} ${last}`,roleId:r.id,role:r.name,platform:r.platform,color:colorList[data.people.length%colorList.length],capacity:copy(data.settings.defaultCapacity)});
  },'Team member added');
  $('#onboardFirst')?.focus();return;
 }
});
// Live preview for free-text roles. The actual role and workstream are stored when Add team member is clicked.
document.addEventListener('input',e=>{
 if(e.target.id!=='onboardRole')return;let value=e.target.value.trim(),display=$('#setupRolePreview');if(!display)return;
 let existing=data.roles.find(r=>r.name.toLowerCase()===value.toLowerCase());
 display.textContent=value?`${existing?'Existing role':'New role'}: ${existing?.name||value} → Platform: ${existing?.platform||guessPlatform(value)}`:'A new role will automatically create its workstream.';
});
document.addEventListener('dblclick',e=>{let day=e.target.closest('.day-cell[data-date], .time-segment[data-date]');if(day){e.preventDefault();openModal('milestone',{date:day.dataset.date})}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(view.modal){closeModal()}else if(view.drawer){closeDrawer()}}});
document.addEventListener('pointerdown',e=>{
 if(e.button!==0||view.modal)return;
 let bar=e.target.closest('.task-bar[data-task]'),pin=e.target.closest('.milestone-pin[data-id]');
 if(!bar&&!pin)return;
 if(bar){let t=getTask(bar.dataset.task);if(!t||['hold','done'].includes(t.status)||computed.schedule[t.id]?.blocked)return}
 view.drag={el:bar||pin,kind:bar?'task':'milestone',id:bar?bar.dataset.task:pin.dataset.id,startX:e.clientX,delta:0,moved:false};
});
document.addEventListener('pointermove',e=>{
 let d=view.drag;if(!d)return;d.delta=e.clientX-d.startX;if(Math.abs(d.delta)>5){d.moved=true;if(d.kind==='task'){d.el.style.transform=`translate(${d.delta}px,-50%)`;d.el.classList.add('dragging')}else d.el.style.transform=`translateX(calc(-50% + ${d.delta}px))`}
});
document.addEventListener('pointerup',e=>{
 let d=view.drag;if(!d)return;view.drag=null;if(!d.moved){return}
 lastDragAt=Date.now();let shift=Math.round(d.delta/view.zoom);if(d.kind==='task'){let t=getTask(d.id);if(t&&shift){change(()=>{t.start=addDays(t.start,shift)},`Task shifted ${Math.abs(shift)} day(s)`)}else render()}
 else {let m=data.milestones.find(m=>m.id===d.id);if(m&&shift){change(()=>{m.date=addDays(m.date,shift)},`Milestone moved ${Math.abs(shift)} day(s)`)}else render()}
});
if(authEmail)activateDemoUser(authEmail);else render();
})();

</script>
</body>
</html>
