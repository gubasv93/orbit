name: Verify Orbit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser journeys against disposable real authentication and PostgreSQL
        run: |
          node scripts/local-backend.mjs > /tmp/orbit-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:3000/api/health > /dev/null; then break; fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then cat /tmp/orbit-backend.log; exit 1; fi
            sleep 1
          done
          browser_path="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          CHROMIUM_PATH="$browser_path" ORBIT_E2E_AUTH=1 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 3
